<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Финансы центра</title>
  <meta name="description" content="Дашборд директора учебного центра: кому напомнить об оплате и кому выплатить зарплату.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 20h4v5H8zm6-6h4v11h-4zm6-7h4v18h-4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Финансы центра</div>
        <div class="brand-sub" id="today-label"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="overview" role="tab">Обзор</button>
      <button class="tab" data-tab="students" role="tab">Ученики</button>
      <button class="tab" data-tab="teachers" role="tab">Преподаватели</button>
      <button class="tab" data-tab="calendar" role="tab">Календарь</button>
      <button class="tab" data-tab="history" role="tab">История</button>
      <button class="tab" data-tab="settings" role="tab">Настройки</button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" aria-label="Закрыть">×</button>
      </div>
      <form id="modal-form" class="modal-body"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
