  <script>
    // Тема и акцент применяются до первой отрисовки, чтобы страница не мигала.
    try {
      var raw = localStorage.getItem('tryos-finance-v2') || localStorage.getItem('edu-finance-v1');
      var s = (raw && JSON.parse(raw).settings) || {}, r = document.documentElement;
      if (s.theme === 'light' || s.theme === 'dark') r.dataset.theme = s.theme;
      if (s.accent) r.dataset.accent = s.accent;
      if (s.density) r.dataset.density = s.density;
    } catch (e) { /* настройки по умолчанию */ }
  </script>

  <script nomodule>document.getElementById('app').innerHTML = '<p style="padding:24px;font-family:system-ui">Этот браузер слишком старый для дашборда. Откройте сайт в свежей версии Chrome, Safari или Firefox.</p>';</script>
